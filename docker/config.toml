# The container's default configuration. Mount your own at /etc/pubky-dispatch/config.toml,
# or point PUBKY_DISPATCH_CONFIG at it. See docs/configuration.md.

[admin]
# Inside the container, listen on every interface; publish the port on a private network
# only.
listen = "0.0.0.0:9090"

[server]
# Set the Dispatch origin to serve the API, for example with a mounted config file:
# origin = "https://dispatch.example"
listen = "0.0.0.0:8080"

[database]
# Set PUBKY_DISPATCH_DATABASE_URL.

[keys]
# Mount a volume here that database backups don't cover.
path = "/var/lib/pubky-dispatch/keys"
