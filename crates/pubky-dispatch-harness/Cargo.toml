[package]
name = "pubky-dispatch-harness"
description = "Test harness: client and signer flows against the Pubky Dispatch service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Test-only: this crate turns on the service's `test-util` and the client's `test-support`.
# No production crate depends on it, and the service's image is built with `-p pubky-dispatch`.
[dependencies]
axum.workspace = true
futures-util.workspace = true
pubky-dispatch = { workspace = true, features = ["test-util"] }
pubky-dispatch-client = { workspace = true, features = ["test-support"] }
pubky-dispatch-core.workspace = true
pubky-dispatch-signer.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
