[package]
name = "pubky-dispatch-signer"
description = "Identity management for the Pubky Dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[example]]
name = "approve_app"
crate-type = ["lib"]

[dependencies]
# Without the client's default `http` feature: the signer uses only the `Transport` trait, and
# the host brings the transport. That keeps reqwest, hyper and the tokio network stack out of
# the signer, so it builds for wasm32-unknown-unknown. The workspace entry keeps the defaults
# for every other crate (an inherited entry cannot turn them off), so only the signer's own
# graph changes; a host that wants the client's HTTPS transport turns on `http` itself, as the
# signer bindings do through their own entry.
pubky-dispatch-client = { path = "../pubky-dispatch-client", default-features = false }
pubky-dispatch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# A browser has no OS entropy source: on wasm32-unknown-unknown each getrandom major version in
# the graph refuses to build until its JavaScript backend is chosen. These entries only select
# that backend; feature unification turns it on for every crate of the wasm32 graph that uses
# the same major version. getrandom 0.2 comes in through pubky-dispatch-core's cipher
# (chacha20poly1305 -> aead -> crypto-common -> rand_core 0.6); 0.3 is a direct dependency of
# the client. From 0.3.4 the `wasm_js` feature alone selects the backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
tempfile.workspace = true
hex.workspace = true
pubky-dispatch-client = { path = "../pubky-dispatch-client", default-features = false, features = ["test-support", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
