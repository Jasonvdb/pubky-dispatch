name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  protocol-names:
    name: No protocol or product named in the Switch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Switch holds no rule, name or definition of a protocol built on it. The README
      # names the first such protocol in one sentence; no other tracked file names it. No
      # tracked file names a product that hosts the signer, the README included. The
      # patterns are written so that this file doesn't match them.
      - name: Only the README's one sentence names the first protocol
        run: |
          pattern='p[a]ykit'
          if git grep -I -i -n -E "$pattern" -- . ':!README.md'; then
            echo "these files name a protocol built on the Switch"
            exit 1
          fi
          lines=$(git grep -I -i -c -E "$pattern" -- README.md | cut -d: -f2)
          if [ "${lines:-0}" -gt 1 ]; then
            echo "README.md names it on $lines lines, not one"
            exit 1
          fi
      - name: No file names a product that hosts the signer
        run: |
          if git grep -I -i -n -E 'b[i]tkit' -- .; then
            echo "these files name a product"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The workspace's tests, split by crate into jobs that run side by side, each within its
  # own time limit. Together they run every crate's tests, doc-tests included, as
  # `cargo test --workspace --all-features` did. The service and the harness need
  # PostgreSQL; with `PUBKY_SWITCH_REQUIRE_DB` set a missing database fails their tests
  # rather than skipping them. The others use none.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: switch
          POSTGRES_PASSWORD: switch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PUBKY_SWITCH_TEST_DATABASE_URL: postgres://switch:switch@localhost:5432/postgres
      PUBKY_SWITCH_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch --all-features --locked

  test-harness:
    name: Tests (harness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: switch
          POSTGRES_PASSWORD: switch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PUBKY_SWITCH_TEST_DATABASE_URL: postgres://switch:switch@localhost:5432/postgres
      PUBKY_SWITCH_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch-harness --all-features --locked

  test-signer:
    name: Tests (signer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch-signer --all-features --locked

  test-client-core:
    name: Tests (client and core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch-client -p pubky-switch-core --all-features --locked
      - name: Check the default client store mode
        run: |
          case_name=store::handle::tests::test_store_handle_new_is_inline_without_tokio
          cargo test -p pubky-switch-client --locked --lib "$case_name" -- --exact | tee "$RUNNER_TEMP/default-store.log"
          grep -Fx "test $case_name ... ok" "$RUNNER_TEMP/default-store.log"
        shell: bash

  # The signer's Kotlin and Swift bindings: the crate's tests, then each host program
  # built against freshly generated sources and the native library, and run once.
  signer-ffi-kotlin:
    name: Signer bindings (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Generated sources and libraries stay out of the cached target directory.
      - name: Choose the output directory
        run: echo "OUT=$RUNNER_TEMP/signer-ffi" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch-signer-ffi --all-features --locked
      # The preparation of the generated bindings refuses generated code it doesn't know.
      - name: Test the bindings' preparation
        run: python3 crates/pubky-switch-signer-ffi/tests/prepare_bindings_test.py
      # A production build, without the test fixtures, generates and exports none of them.
      - name: Check a production build exports no fixtures
        run: |
          cargo build --locked --release -p pubky-switch-signer-ffi --features bindgen \
            --lib --bin pubky-switch-signer-bindgen
          mkdir -p "$OUT/production/lib"
          cp target/release/libpubky_switch_signer_ffi.so "$OUT/production/lib/"
          crates/pubky-switch-signer-ffi/generate-bindings.sh target/release/pubky-switch-signer-bindgen \
            "$OUT/production/lib/libpubky_switch_signer_ffi.so" "$OUT/production"
          if grep -r -i -E -l 'redaction_?fixture|fixture_?failure|fixture_?callback' "$OUT/production"; then
            echo "a production build exports the test fixtures"
            exit 1
          fi
      - name: Build the library and generate the bindings
        run: |
          cargo build --locked --release -p pubky-switch-signer-ffi --features bindgen,test-fixtures \
            --lib --bin pubky-switch-signer-bindgen
          mkdir -p "$OUT/lib"
          cp target/release/libpubky_switch_signer_ffi.so "$OUT/lib/"
          crates/pubky-switch-signer-ffi/generate-bindings.sh \
            target/release/pubky-switch-signer-bindgen "$OUT/lib/libpubky_switch_signer_ffi.so" "$OUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.0"
      - name: Run the Kotlin host
        run: |
          gradle -p crates/pubky-switch-signer-ffi/tests/hosts --no-daemon \
            -Pbindings="$OUT/kotlin" -PnativeLibraryDir="$OUT/lib" run

  signer-ffi-swift:
    name: Signer bindings (Swift)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose the output directory
        run: echo "OUT=$RUNNER_TEMP/signer-ffi" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the library and generate the bindings
        run: |
          cargo build --locked --release -p pubky-switch-signer-ffi --features bindgen,test-fixtures \
            --lib --bin pubky-switch-signer-bindgen
          mkdir -p "$OUT/lib"
          cp target/release/libpubky_switch_signer_ffi.dylib "$OUT/lib/"
          crates/pubky-switch-signer-ffi/generate-bindings.sh \
            target/release/pubky-switch-signer-bindgen "$OUT/lib/libpubky_switch_signer_ffi.dylib" "$OUT"
      - name: Build the Swift host
        run: |
          swiftc -swift-version 5 -I "$OUT/swift" \
            -Xcc "-fmodule-map-file=$OUT/swift/PubkySwitchSignerFFI.modulemap" \
            -emit-library -emit-module -module-name PubkySwitchSigner "$OUT"/swift/*.swift \
            -emit-module-path "$OUT/PubkySwitchSigner.swiftmodule" -o "$OUT/libPubkySwitchSigner.dylib" \
            -L "$OUT/lib" -lpubky_switch_signer_ffi
          swiftc -swift-version 6 -parse-as-library -I "$OUT" -I "$OUT/swift" \
            -Xcc "-fmodule-map-file=$OUT/swift/PubkySwitchSignerFFI.modulemap" \
            crates/pubky-switch-signer-ffi/tests/hosts/*.swift \
            -L "$OUT" -lPubkySwitchSigner -L "$OUT/lib" -lpubky_switch_signer_ffi -o "$OUT/host"
      - name: Run the Swift host
        run: DYLD_LIBRARY_PATH="$OUT:$OUT/lib" "$OUT/host"

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: MSRV (1.91.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --all-features --locked

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t pubky-switch:ci .
      - name: Smoke test
        run: |
          docker run --rm pubky-switch:ci check-config
          docker network create switch
          docker run -d --name db --network switch \
            -e POSTGRES_USER=switch -e POSTGRES_PASSWORD=switch postgres:17
          # Over TCP, as the service connects: while it initializes, the image's server
          # answers on its Unix socket only, then restarts.
          for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U switch && break; sleep 1; done
          docker run -d --name switch --network switch -p 127.0.0.1:9090:9090 \
            -e PUBKY_SWITCH_DATABASE_URL=postgres://switch:switch@db:5432/switch \
            pubky-switch:ci
          for i in $(seq 1 30); do curl -sf localhost:9090/health/ready && break; sleep 1; done
          curl -sf localhost:9090/health/ready
          docker stop switch
      - name: Service logs
        if: failure()
        run: |
          docker ps -a
          docker logs switch || true
          docker logs db 2>&1 | tail -50 || true
