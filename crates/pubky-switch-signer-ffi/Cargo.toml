[package]
name = "pubky-switch-signer-ffi"
description = "Kotlin and Swift bindings of the Pubky Switch signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pubky_switch_signer_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The generator binary: only the build that writes the Kotlin and Swift sources needs it.
bindgen = ["uniffi/cli"]
# Values the host programs check the redaction with. No production build enables it.
test-fixtures = []

[[bin]]
name = "pubky-switch-signer-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
pubky-switch-core.workspace = true
pubky-switch-signer.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
uniffi = "=0.29.5"
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
